<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/frontend/web

    <Directory /var/www/html/frontend/web>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
